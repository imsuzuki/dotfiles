[font.normal]
family = "MesloLGS NF"
style = "Regular"

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
opacity = 0.95
decorations = "Buttonless"
startup_mode = "Maximized"
dynamic_padding = true
padding = { x = 10, y = 8 }
